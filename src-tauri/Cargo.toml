[package]
name = "arbor"
version = "0.1.0"
edition = "2021"

[lib]
name = "arbor_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["app"]
app = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

[[test]]
name = "t002-migrations"
path = "../tests/T-002/migrations.rs"

[[test]]
name = "t002-contract-sync"
path = "../tests/T-002/contract_sync.rs"

[[test]]
name = "t006-commands"
path = "../tests/T-006/commands.rs"

[[test]]
name = "t007-unlock"
path = "../tests/T-007/unlock.rs"

[[test]]
name = "t008-large-fixture"
path = "../tests/T-008/large_fixture.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
